<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Stream and table duality in Demo 07</title>
  <desc id="desc">Append-only Demo 07 events become changes over time and update a current keyed view. The same memory responsibility can be owned by a Python dictionary, a ksqlDB or Kafka Streams state store, or Flink managed keyed state.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1c2433" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#a9adb6"/>
    </marker>
    <style>
      .bg { fill: #fbfbfa; }
      .title { fill: #16181d; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.5px; }
      .subtitle { fill: #626873; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font: 750 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .section-title { fill: #16181d; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section-sub { fill: #626873; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .row-main { fill: #24272e; font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .row-sub { fill: #626873; font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #3e4551; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .chip { font: 750 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.8px; }
      .owner-title { fill: #16181d; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .owner-sub { fill: #626873; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .statement { fill: #16181d; font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: none; stroke: #a9adb6; stroke-width: 2.2; marker-end: url(#arrow-neutral); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="760"/>

  <text class="eyebrow" x="70" y="40" fill="#d64545">LECTURE 9 · SHARED FOUNDATION</text>
  <text class="title" x="70" y="78">Stream and table are two views of one evolving fact</text>
  <text class="subtitle" x="70" y="106">A stream records every change. A table holds the current value for each key.</text>

  <!-- Left: append-only stream -->
  <g filter="url(#shadow)">
    <rect x="70" y="140" width="500" height="366" rx="20" fill="#ffffff" stroke="#edc7c7" stroke-width="1.6"/>
    <path d="M90 140 H550 A20 20 0 0 1 570 160 V188 H70 V160 A20 20 0 0 1 90 140Z" fill="#f9eaea"/>
  </g>
  <circle cx="104" cy="164" r="8" fill="#d64545"/>
  <text class="section-title" x="124" y="172">Append-only events</text>
  <text class="section-sub" x="94" y="214">Every quote and outcome remains part of the history.</text>

  <g transform="translate(94 235)">
    <rect width="452" height="54" rx="11" fill="#fff9f9" stroke="#f1d8d8"/>
    <rect width="8" height="54" rx="4" fill="#d64545"/>
    <text class="mono" x="24" y="23">01 · trip_7650 · FareQuoteV1</text>
    <text class="row-sub" x="24" y="42">rule-v1 · fare 1000 cents</text>
  </g>
  <g transform="translate(94 299)">
    <rect width="452" height="54" rx="11" fill="#fff9f9" stroke="#f1d8d8"/>
    <rect width="8" height="54" rx="4" fill="#d64545"/>
    <text class="mono" x="24" y="23">02 · trip_7650 · FareQuoteV1</text>
    <text class="row-sub" x="24" y="42">ridge-v2 · fare 1420 cents</text>
  </g>
  <g transform="translate(94 363)">
    <rect width="452" height="54" rx="11" fill="#fff9f9" stroke="#f1d8d8"/>
    <rect width="8" height="54" rx="4" fill="#d64545"/>
    <text class="mono" x="24" y="23">03 · trip_7650 · TripOutcomeV1</text>
    <text class="row-sub" x="24" y="42">actual cost 1226 cents · delayed label</text>
  </g>
  <g transform="translate(94 427)">
    <rect width="452" height="54" rx="11" fill="#f5f6f7" stroke="#d9dcd8" stroke-dasharray="5 3"/>
    <text class="row-main" x="226" y="24" text-anchor="middle">New events append here</text>
    <text class="row-sub" x="226" y="42" text-anchor="middle">The earlier facts do not disappear.</text>
  </g>

  <rect x="160" y="522" width="320" height="35" rx="17.5" fill="#f9eaea" stroke="#edc7c7"/>
  <text class="chip" x="320" y="545" text-anchor="middle" fill="#d64545">STREAM = CHANGES OVER TIME</text>

  <!-- Center: changelog mechanics -->
  <g transform="translate(615 166)">
    <rect width="370" height="315" rx="20" fill="#ffffff" stroke="#d9dcd8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="eyebrow" x="185" y="31" text-anchor="middle" fill="#626873">APPLY CHANGES IN ORDER</text>

    <g transform="translate(46 58)">
      <circle cx="28" cy="28" r="25" fill="#f9eaea" stroke="#edc7c7"/>
      <text class="section-title" x="28" y="36" text-anchor="middle" fill="#d64545">+</text>
      <text class="row-main" x="72" y="24">Quote arrives</text>
      <text class="row-sub" x="72" y="43">Hold by trip_id</text>
    </g>
    <path class="arrow" d="M74 116 V143"/>

    <g transform="translate(46 145)">
      <circle cx="28" cy="28" r="25" fill="#f9eaea" stroke="#edc7c7"/>
      <text class="section-title" x="28" y="36" text-anchor="middle" fill="#d64545">+</text>
      <text class="row-main" x="72" y="24">Outcome arrives</text>
      <text class="row-sub" x="72" y="43">Complete the key</text>
    </g>
    <path class="arrow" d="M74 203 V230"/>

    <g transform="translate(46 232)">
      <circle cx="28" cy="28" r="25" fill="#e7f3f0" stroke="#c0e0d8"/>
      <path d="M17 28 l7 7 l15 -17" fill="none" stroke="#0e7f66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="row-main" x="72" y="24">Emit evaluation</text>
      <text class="row-sub" x="72" y="43">Update the keyed view</text>
    </g>
  </g>

  <path class="arrow" d="M570 322 H612"/>
  <path class="arrow" d="M988 322 H1030"/>

  <!-- Right: current keyed table -->
  <g filter="url(#shadow)">
    <rect x="1030" y="140" width="500" height="366" rx="20" fill="#ffffff" stroke="#c0e0d8" stroke-width="1.6"/>
    <path d="M1050 140 H1510 A20 20 0 0 1 1530 160 V188 H1030 V160 A20 20 0 0 1 1050 140Z" fill="#e7f3f0"/>
  </g>
  <circle cx="1064" cy="164" r="8" fill="#0e7f66"/>
  <text class="section-title" x="1084" y="172">Current keyed table / state</text>
  <text class="section-sub" x="1054" y="214">One current value per key, derived from the event history.</text>

  <g transform="translate(1054 235)">
    <rect width="452" height="38" rx="9" fill="#f3f7f6" stroke="#d6e9e4"/>
    <text class="eyebrow" x="18" y="24" fill="#0e7f66">KEY</text>
    <text class="eyebrow" x="160" y="24" fill="#0e7f66">CURRENT VALUE</text>
  </g>
  <g transform="translate(1054 281)">
    <rect width="452" height="66" rx="11" fill="#ffffff" stroke="#d9e8e4"/>
    <text class="mono" x="18" y="28">trip_7650</text>
    <text class="row-main" x="160" y="25">2 quotes + 1 outcome</text>
    <text class="row-sub" x="160" y="46">Ready: 2 pricing evaluations</text>
  </g>
  <g transform="translate(1054 357)">
    <rect width="452" height="66" rx="11" fill="#ffffff" stroke="#d9e8e4"/>
    <text class="mono" x="18" y="28">trip_7651</text>
    <text class="row-main" x="160" y="25">2 quotes · no outcome yet</text>
    <text class="row-sub" x="160" y="46">Waiting in keyed state</text>
  </g>
  <g transform="translate(1054 433)">
    <rect width="452" height="48" rx="11" fill="#f3f7f6" stroke="#d6e9e4"/>
    <text class="row-main" x="226" y="21" text-anchor="middle">The table changes as events arrive</text>
    <text class="row-sub" x="226" y="38" text-anchor="middle">It is a view, not a second source of truth.</text>
  </g>

  <rect x="1120" y="522" width="320" height="35" rx="17.5" fill="#e7f3f0" stroke="#c0e0d8"/>
  <text class="chip" x="1280" y="545" text-anchor="middle" fill="#0e7f66">TABLE = CURRENT VALUE PER KEY</text>

  <!-- Runtime ownership mapping -->
  <text class="eyebrow" x="70" y="596" fill="#626873">SAME DEMO 07 MEMORY RESPONSIBILITY · DIFFERENT RUNTIME OWNER</text>

  <g transform="translate(70 615)" filter="url(#shadow)">
    <rect width="460" height="76" rx="16" fill="#ffffff" stroke="#ccd7fb"/>
    <rect width="8" height="76" rx="4" fill="#3565f2"/>
    <circle cx="42" cy="28" r="9" fill="#3565f2"/>
    <text class="owner-title" x="62" y="33">Python dictionary</text>
    <text class="owner-sub" x="26" y="57">Visible, bounded, application-owned memory</text>
  </g>

  <g transform="translate(570 615)" filter="url(#shadow)">
    <rect width="460" height="76" rx="16" fill="#ffffff" stroke="#dcd2f4"/>
    <rect width="8" height="76" rx="4" fill="#6f4fc3"/>
    <circle cx="42" cy="28" r="9" fill="#6f4fc3"/>
    <text class="owner-title" x="62" y="33">ksqlDB / Kafka Streams state store</text>
    <text class="owner-sub" x="26" y="57">Kafka-native streaming SQL database/layer built on Kafka Streams</text>
  </g>

  <g transform="translate(1070 615)" filter="url(#shadow)">
    <rect width="460" height="76" rx="16" fill="#ffffff" stroke="#efc7d3"/>
    <rect width="8" height="76" rx="4" fill="#d1345b"/>
    <circle cx="42" cy="28" r="9" fill="#d1345b"/>
    <text class="owner-title" x="62" y="33">Flink managed keyed state</text>
    <text class="owner-sub" x="26" y="57">Flink SQL is a relational interface to a general stateful engine</text>
  </g>

  <rect x="310" y="710" width="980" height="36" rx="18" fill="#f5f6f7" stroke="#d9dcd8"/>
  <text class="statement" x="800" y="734" text-anchor="middle">The business operation does not change; the runtime owner does.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Window aggregation compared with a time-bounded join</title>
  <desc id="desc">Window types for ksqlDB and Flink SQL are separated from time-bounded joins, which belong under the join operator family.</desc>

  <defs>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#182230" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 40px; font-weight: 760; fill: #151a23; letter-spacing: -0.7px; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #697181; }
      .family { font-size: 15px; font-weight: 820; letter-spacing: 1.3px; }
      .column-title { font-size: 26px; font-weight: 770; fill: #202631; }
      .column-note { font-size: 16px; font-weight: 480; fill: #697181; }
      .lane-name { font-size: 20px; font-weight: 760; fill: #ffffff; }
      .chip { font-size: 15px; font-weight: 760; fill: #343c49; }
      .main { font-size: 19px; font-weight: 720; fill: #202631; }
      .note { font-size: 15px; font-weight: 480; fill: #6c7584; }
      .code { font-size: 17px; font-weight: 650; fill: #252c36; }
      .takeaway { font-size: 23px; font-weight: 780; fill: #1f2937; }
      .takeaway-note { font-size: 15px; font-weight: 520; fill: #5e6877; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f5f6f8"/>

  <g class="sans">
    <text class="title" x="80" y="62">Window aggregation is not an interval join.</text>
    <text class="subtitle" x="80" y="94">Both use time and state, but they answer different questions and belong to different operator families.</text>

    <!-- Family headers -->
    <text class="family mono" x="80" y="139" fill="#3f6fd8">WINDOW AGGREGATION</text>
    <text class="family mono" x="840" y="139" fill="#c93457">TIME-BOUNDED JOIN</text>

    <g filter="url(#soft-shadow)">
      <rect x="80" y="158" width="680" height="448" rx="22" fill="#ffffff" stroke="#d6deef" stroke-width="2"/>
      <rect x="840" y="158" width="680" height="448" rx="22" fill="#ffffff" stroke="#ead9df" stroke-width="2"/>
    </g>

    <!-- Left: window aggregation -->
    <text class="column-title" x="116" y="207">Group many rows into a time bucket</text>
    <text class="column-note" x="116" y="236">Example: average markup per model for each completed period.</text>

    <rect x="116" y="270" width="608" height="108" rx="16" fill="#f3f0fb" stroke="#d9cff0" stroke-width="2"/>
    <rect x="116" y="270" width="142" height="108" rx="16" fill="#6f4fc3"/>
    <text class="lane-name" x="145" y="329">ksqlDB</text>
    <rect x="282" y="299" width="122" height="48" rx="24" fill="#ffffff"/>
    <rect x="416" y="299" width="122" height="48" rx="24" fill="#ffffff"/>
    <rect x="550" y="299" width="132" height="48" rx="24" fill="#ffffff"/>
    <text class="chip mono" x="343" y="329" text-anchor="middle">TUMBLING</text>
    <text class="chip mono" x="477" y="329" text-anchor="middle">HOPPING</text>
    <text class="chip mono" x="616" y="329" text-anchor="middle">SESSION</text>

    <rect x="116" y="398" width="608" height="108" rx="16" fill="#fcedf1" stroke="#efced7" stroke-width="2"/>
    <rect x="116" y="398" width="142" height="108" rx="16" fill="#d1345b"/>
    <text class="lane-name" x="145" y="457">Flink SQL</text>
    <rect x="272" y="427" width="92" height="48" rx="24" fill="#ffffff"/>
    <rect x="374" y="427" width="82" height="48" rx="24" fill="#ffffff"/>
    <rect x="466" y="427" width="120" height="48" rx="24" fill="#ffffff"/>
    <rect x="596" y="427" width="102" height="48" rx="24" fill="#ffffff"/>
    <text class="chip mono" x="318" y="457" text-anchor="middle">TUMBLE</text>
    <text class="chip mono" x="415" y="457" text-anchor="middle">HOP</text>
    <text class="chip mono" x="526" y="457" text-anchor="middle">CUMULATE</text>
    <text class="chip mono" x="647" y="457" text-anchor="middle">SESSION</text>

    <text class="main" x="116" y="551">WINDOW belongs to aggregation.</text>
    <text class="note" x="116" y="578">It decides which rows contribute to one count, sum, or average.</text>

    <!-- Center divider -->
    <line x1="800" y1="180" x2="800" y2="584" stroke="#cbd0d9" stroke-width="2" stroke-dasharray="7 10"/>
    <circle cx="800" cy="380" r="38" fill="#ffffff" stroke="#cbd0d9" stroke-width="2"/>
    <text class="family mono" x="800" y="376" text-anchor="middle" fill="#606a78">NOT</text>
    <text class="family mono" x="800" y="396" text-anchor="middle" fill="#606a78">THE SAME</text>

    <!-- Right: joins -->
    <text class="column-title" x="876" y="207">Match rows from two streams</text>
    <text class="column-note" x="876" y="236">Example: quote plus delayed outcome with the same trip_id.</text>

    <rect x="876" y="270" width="608" height="108" rx="16" fill="#f3f0fb" stroke="#d9cff0" stroke-width="2"/>
    <rect x="876" y="270" width="142" height="108" rx="16" fill="#6f4fc3"/>
    <text class="lane-name" x="905" y="329">ksqlDB</text>
    <text class="code mono" x="1050" y="316">JOIN ... WITHIN 1 HOUR</text>
    <text class="note" x="1050" y="346">Time bounds the stream-stream match.</text>

    <rect x="876" y="398" width="608" height="108" rx="16" fill="#fcedf1" stroke="#efced7" stroke-width="2"/>
    <rect x="876" y="398" width="142" height="108" rx="16" fill="#d1345b"/>
    <text class="lane-name" x="905" y="457">Flink SQL</text>
    <text class="code mono" x="1050" y="440">JOIN ... ON key</text>
    <text class="code mono" x="1050" y="465">AND rowtime BETWEEN ...</text>
    <text class="note" x="1050" y="489">The interval bounds both sides in time.</text>

    <text class="main" x="876" y="551">The interval belongs under JOIN.</text>
    <text class="note" x="876" y="578">It limits which cross-stream pairs can match and how long state waits.</text>

    <!-- Takeaway -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="642" width="1440" height="86" rx="18" fill="#edf5f3" stroke="#b7d8d0" stroke-width="2"/>
    </g>
    <rect x="80" y="642" width="8" height="86" rx="4" fill="#198f78"/>
    <text class="takeaway" x="116" y="678">Use WINDOW to group; use an interval bound to limit JOIN state.</text>
    <text class="takeaway-note" x="116" y="706">A time-bounded join is still a join, even when its syntax mentions a window or interval.</text>
  </g>
</svg>

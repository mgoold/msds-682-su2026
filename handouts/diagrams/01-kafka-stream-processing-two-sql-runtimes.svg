<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Kafka stream processing with two SQL runtime owners</title>
  <desc id="desc">Events enter Kafka topics, then either ksqlDB or Flink SQL performs the same stateful stream-processing operations before writing derived topics or tables for downstream consumers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#98a2b3" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.07" />
    </filter>
  </defs>

  <rect width="1600" height="760" fill="#f4f4f2" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="68" fill="#667085" font-size="18" font-weight="700" letter-spacing="2.2">LECTURE 9 · TWO SQL RUNTIME OWNERS</text>
    <text x="72" y="120" fill="#111827" font-size="42" font-weight="760" letter-spacing="-1.3">One event log, two ways to own stream processing</text>
    <text x="72" y="155" fill="#667085" font-size="21">The business operation stays fixed. The runtime responsible for state, time, and recovery changes.</text>

    <!-- Shared source path -->
    <g filter="url(#softShadow)">
      <rect x="72" y="282" width="170" height="126" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
    </g>
    <circle cx="116" cy="324" r="12" fill="#3565f2" />
    <circle cx="148" cy="324" r="12" fill="#0e7f66" />
    <circle cx="180" cy="324" r="12" fill="#d1345b" />
    <text x="104" y="366" fill="#111827" font-size="25" font-weight="740">Events</text>
    <text x="104" y="392" fill="#667085" font-size="17">Continuous facts</text>

    <path d="M 242 345 H 286" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />

    <g filter="url(#softShadow)">
      <rect x="302" y="262" width="220" height="166" rx="18" fill="#ffffff" stroke="#d64545" stroke-width="2.5" />
    </g>
    <rect x="330" y="294" width="54" height="11" rx="5.5" fill="#d64545" opacity="0.32" />
    <rect x="330" y="314" width="76" height="11" rx="5.5" fill="#d64545" opacity="0.62" />
    <rect x="330" y="334" width="98" height="11" rx="5.5" fill="#d64545" />
    <text x="330" y="382" fill="#111827" font-size="26" font-weight="760">Kafka topics</text>
    <text x="330" y="409" fill="#667085" font-size="17">Durable event log</text>

    <!-- Fork -->
    <path d="M 522 345 H 570 V 248 H 620" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />
    <path d="M 570 345 V 485 H 620" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />
    <circle cx="570" cy="345" r="7" fill="#98a2b3" />

    <!-- ksqlDB lane -->
    <rect x="638" y="190" width="625" height="182" rx="20" fill="#ffffff" stroke="#dcd2f4" stroke-width="2.5" filter="url(#softShadow)" />
    <rect x="638" y="190" width="14" height="182" rx="7" fill="#6f4fc3" />
    <text x="682" y="230" fill="#6f4fc3" font-size="18" font-weight="800" letter-spacing="1.4">KSQLDB LANE</text>
    <text x="682" y="265" fill="#111827" font-size="28" font-weight="760">Kafka-native streaming SQL layer</text>
    <text x="682" y="294" fill="#667085" font-size="18">A persistent query runs on Kafka Streams.</text>
    <line x1="682" y1="316" x2="1218" y2="316" stroke="#e4e7ec" stroke-width="2" />
    <text x="682" y="349" fill="#111827" font-size="19" font-weight="680">Filter  ·  Map  ·  Join  ·  Window  ·  Aggregate</text>
    <text x="1045" y="349" fill="#6f4fc3" font-size="17" font-weight="720">Keyed state + event time</text>

    <!-- Flink SQL lane -->
    <rect x="638" y="414" width="625" height="200" rx="20" fill="#ffffff" stroke="#efc2ce" stroke-width="2.5" filter="url(#softShadow)" />
    <rect x="638" y="414" width="14" height="200" rx="7" fill="#d1345b" />
    <text x="682" y="452" fill="#d1345b" font-size="18" font-weight="800" letter-spacing="1.4">FLINK SQL LANE</text>
    <text x="682" y="486" fill="#111827" font-size="27" font-weight="760">SQL interface to a general</text>
    <text x="682" y="516" fill="#111827" font-size="27" font-weight="760">stream-processing engine</text>
    <text x="682" y="545" fill="#667085" font-size="18">Kafka can be one source and sink among others.</text>
    <line x1="682" y1="562" x2="1218" y2="562" stroke="#e4e7ec" stroke-width="2" />
    <text x="682" y="595" fill="#111827" font-size="19" font-weight="680">Filter  ·  Map  ·  Join  ·  Window  ·  Aggregate</text>
    <text x="1045" y="595" fill="#d1345b" font-size="17" font-weight="720">Keyed state + event time</text>

    <!-- Merge to output -->
    <path d="M 1263 281 H 1300 V 350 H 1328" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />
    <path d="M 1263 515 H 1300 V 410 H 1328" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />

    <g filter="url(#softShadow)">
      <rect x="1342" y="300" width="190" height="162" rx="18" fill="#ffffff" stroke="#c0e0d8" stroke-width="2.5" />
    </g>
    <path d="M 1380 336 H 1490 M 1380 356 H 1468 M 1380 376 H 1510" fill="none" stroke="#0e7f66" stroke-width="9" stroke-linecap="round" opacity="0.75" />
    <text x="1380" y="417" fill="#111827" font-size="22" font-weight="760">Derived topic</text>
    <text x="1380" y="443" fill="#667085" font-size="17">or dynamic table</text>

    <path d="M 1437 462 V 503" fill="none" stroke="#98a2b3" stroke-width="4" marker-end="url(#arrow)" />
    <text x="1339" y="541" fill="#111827" font-size="21" font-weight="720">Downstream consumers</text>
    <text x="1324" y="570" fill="#667085" font-size="17">API  ·  dashboard  ·  model</text>

    <!-- Central takeaway -->
    <rect x="302" y="650" width="960" height="72" rx="14" fill="#eef1fe" />
    <rect x="302" y="650" width="7" height="72" rx="3.5" fill="#3565f2" />
    <text x="334" y="694" fill="#1d2f6f" font-size="27" font-weight="760">Same stream-processing questions; different runtime owner.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Kafka offset, runtime state, and recovery copy</title>
  <desc id="desc">Three separate layers and a crash-restart workflow showing that offsets replay input while state restores computation.</desc>

  <defs>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#182230" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3f6fd8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#198f78"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 40px; font-weight: 760; fill: #151a23; letter-spacing: -0.7px; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #697181; }
      .number { font-size: 15px; font-weight: 800; fill: #ffffff; letter-spacing: 0.8px; }
      .layer-name { font-size: 23px; font-weight: 760; fill: #202631; }
      .layer-role { font-size: 16px; font-weight: 650; fill: #3e4754; }
      .layer-note { font-size: 15px; font-weight: 470; fill: #707887; }
      .workflow-label { font-size: 16px; font-weight: 800; letter-spacing: 1px; }
      .workflow-main { font-size: 19px; font-weight: 730; fill: #202631; }
      .workflow-note { font-size: 14px; font-weight: 470; fill: #6e7785; }
      .takeaway { font-size: 23px; font-weight: 780; fill: #1f2937; }
      .takeaway-note { font-size: 15px; font-weight: 520; fill: #5e6877; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f5f6f8"/>

  <g class="sans">
    <text class="title" x="80" y="62">Three layers. Three different jobs.</text>
    <text class="subtitle" x="80" y="94">Do not use offset, state, and checkpoint as interchangeable words.</text>

    <!-- Layer 1: offset -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="132" width="880" height="126" rx="18" fill="#ffffff" stroke="#cbd8f6" stroke-width="2"/>
    </g>
    <rect x="80" y="132" width="10" height="126" rx="5" fill="#3f6fd8"/>
    <circle cx="130" cy="174" r="23" fill="#3f6fd8"/>
    <text class="number mono" x="130" y="180" text-anchor="middle">01</text>
    <text class="layer-name" x="170" y="171">Kafka offset</text>
    <text class="layer-role" x="170" y="201">Input position</text>
    <text class="layer-note" x="170" y="229">Which partition record should this consumer read next?</text>
    <rect x="656" y="164" width="258" height="58" rx="12" fill="#eef3fe"/>
    <text class="layer-note mono" x="685" y="189">partition 0</text>
    <text class="layer-name mono" x="685" y="212">next offset: 128</text>

    <!-- Layer 2: runtime state -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="278" width="880" height="126" rx="18" fill="#ffffff" stroke="#c7e2dc" stroke-width="2"/>
    </g>
    <rect x="80" y="278" width="10" height="126" rx="5" fill="#198f78"/>
    <circle cx="130" cy="320" r="23" fill="#198f78"/>
    <text class="number mono" x="130" y="326" text-anchor="middle">02</text>
    <text class="layer-name" x="170" y="317">Runtime state</text>
    <text class="layer-role" x="170" y="347">Remembered unmatched rows and aggregates</text>
    <text class="layer-note" x="170" y="375">What must the computation remember between records?</text>
    <rect x="622" y="304" width="292" height="74" rx="12" fill="#edf7f4"/>
    <text class="layer-note mono" x="648" y="331">trip-42: quote waiting</text>
    <text class="layer-note mono" x="648" y="357">ridge-v2: sum / count</text>

    <!-- Layer 3: recovery copy -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="424" width="880" height="126" rx="18" fill="#ffffff" stroke="#ead7ad" stroke-width="2"/>
    </g>
    <rect x="80" y="424" width="10" height="126" rx="5" fill="#c58a16"/>
    <circle cx="130" cy="466" r="23" fill="#c58a16"/>
    <text class="number mono" x="130" y="472" text-anchor="middle">03</text>
    <text class="layer-name" x="170" y="463">Checkpoint / changelog</text>
    <text class="layer-role" x="170" y="493">Recovery copy</text>
    <text class="layer-note" x="170" y="521">What durable copy can rebuild the computation after failure?</text>
    <rect x="622" y="450" width="292" height="74" rx="12" fill="#fbf5e7"/>
    <path d="M653 473 h40 v29 h-40 z M661 465 h40 v29" fill="none" stroke="#9b6d12" stroke-width="3" stroke-linejoin="round"/>
    <text class="layer-note mono" x="718" y="480">state snapshot</text>
    <text class="layer-note mono" x="718" y="504">or change log</text>

    <!-- Crash and restart workflow -->
    <text class="workflow-label mono" x="1035" y="146" fill="#657080">CRASH / RESTART</text>
    <g filter="url(#soft-shadow)">
      <rect x="1020" y="168" width="500" height="382" rx="20" fill="#ffffff" stroke="#dfe3e9" stroke-width="2"/>
    </g>

    <rect x="1052" y="200" width="436" height="72" rx="14" fill="#fff1f3" stroke="#f0cbd3" stroke-width="2"/>
    <circle cx="1092" cy="236" r="22" fill="#c93457"/>
    <path d="M1082 226 l20 20 M1102 226 l-20 20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text class="workflow-main" x="1130" y="231">Running task crashes</text>
    <text class="workflow-note" x="1130" y="252">In-memory state is no longer available.</text>

    <line x1="1270" y1="272" x2="1270" y2="309" stroke="#198f78" stroke-width="3" marker-end="url(#arrow-green)"/>

    <rect x="1052" y="316" width="436" height="78" rx="14" fill="#edf7f4" stroke="#c7e2dc" stroke-width="2"/>
    <circle cx="1092" cy="355" r="22" fill="#198f78"/>
    <text class="number mono" x="1092" y="361" text-anchor="middle">1</text>
    <text class="workflow-main" x="1130" y="350">Restore the computation</text>
    <text class="workflow-note" x="1130" y="372">Load the checkpoint or rebuild from the changelog.</text>

    <line x1="1270" y1="394" x2="1270" y2="425" stroke="#3f6fd8" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="1052" y="432" width="436" height="86" rx="14" fill="#eef3fe" stroke="#cbd8f6" stroke-width="2"/>
    <circle cx="1092" cy="475" r="22" fill="#3f6fd8"/>
    <text class="number mono" x="1092" y="481" text-anchor="middle">2</text>
    <text class="workflow-main" x="1130" y="467">Resume or replay input</text>
    <text class="workflow-note" x="1130" y="489">Use the offset and retained Kafka records.</text>
    <text class="workflow-note" x="1130" y="508">Then continue with restored state.</text>

    <!-- Cross-layer cues -->
    <path d="M960 195 C1002 195 1004 466 1052 466" fill="none" stroke="#3f6fd8" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M960 487 C1002 487 1004 355 1052 355" fill="none" stroke="#198f78" stroke-width="3" marker-end="url(#arrow-green)"/>

    <!-- Takeaway -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="604" width="1440" height="92" rx="18" fill="#edf5f3" stroke="#b7d8d0" stroke-width="2"/>
    </g>
    <rect x="80" y="604" width="8" height="92" rx="4" fill="#198f78"/>
    <text class="takeaway" x="116" y="644">Offsets replay input; state restores the computation.</text>
    <text class="takeaway-note" x="116" y="672">A saved input position cannot reconstruct unmatched joins or running aggregates by itself.</text>
  </g>
</svg>

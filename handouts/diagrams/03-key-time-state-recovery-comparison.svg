<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">ksqlDB and Flink SQL responsibility comparison</title>
  <desc id="desc">A five-question comparison of key, time, state, recovery, and lifecycle responsibilities in ksqlDB and Flink SQL.</desc>

  <defs>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#182230" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 40px; font-weight: 760; fill: #151a23; letter-spacing: -0.7px; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #697181; }
      .lane-name { font-size: 23px; font-weight: 760; fill: #ffffff; }
      .lane-note { font-size: 15px; font-weight: 560; fill: #ffffff; opacity: 0.86; }
      .row-main { font-size: 20px; font-weight: 700; fill: #202631; }
      .row-note { font-size: 15px; font-weight: 480; fill: #707887; }
      .spine-label { font-size: 14px; font-weight: 800; fill: #3f4857; letter-spacing: 1.2px; }
      .takeaway { font-size: 22px; font-weight: 760; fill: #1f2937; }
      .takeaway-note { font-size: 15px; font-weight: 520; fill: #5e6877; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f5f6f8"/>

  <g class="sans">
    <text class="title" x="80" y="62">Same SQL-shaped problem. Different runtime responsibilities.</text>
    <text class="subtitle" x="80" y="94">Ask the same five questions before comparing syntax or product names.</text>

    <g filter="url(#soft-shadow)">
      <rect x="80" y="122" width="620" height="58" rx="16" fill="#6f4fc3"/>
      <rect x="900" y="122" width="620" height="58" rx="16" fill="#d1345b"/>
    </g>
    <text class="lane-name" x="108" y="159">ksqlDB</text>
    <text class="lane-name" x="928" y="159">Flink SQL</text>
    <text class="lane-note" x="590" y="158" text-anchor="end" fill="#ffffff">persistent Kafka-centric SQL application</text>
    <text class="lane-note" x="1410" y="158" text-anchor="end" fill="#ffffff">continuous SQL statement / job</text>

    <!-- Shared five-question spine -->
    <line x1="800" y1="213" x2="800" y2="615" stroke="#c8ced8" stroke-width="3"/>

    <!-- KEY -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="198" width="620" height="72" rx="14" fill="#ffffff" stroke="#ded9ee" stroke-width="2"/>
      <rect x="900" y="198" width="620" height="72" rx="14" fill="#ffffff" stroke="#f0d5dd" stroke-width="2"/>
    </g>
    <line x1="700" y1="234" x2="754" y2="234" stroke="#b9a9e1" stroke-width="3"/>
    <line x1="846" y1="234" x2="900" y2="234" stroke="#e4a5b7" stroke-width="3"/>
    <circle cx="800" cy="234" r="46" fill="#ffffff" stroke="#c7cdd7" stroke-width="2"/>
    <text class="spine-label mono" x="800" y="239" text-anchor="middle">KEY</text>
    <text class="row-main" x="108" y="228">trip_id / co-partitioned streams</text>
    <text class="row-note" x="108" y="252">The same key must reach the same stream task.</text>
    <text class="row-main" x="928" y="228">trip_id / keyed state</text>
    <text class="row-note" x="928" y="252">The same key must reach the same parallel task.</text>

    <!-- TIME -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="286" width="620" height="72" rx="14" fill="#ffffff" stroke="#ded9ee" stroke-width="2"/>
      <rect x="900" y="286" width="620" height="72" rx="14" fill="#ffffff" stroke="#f0d5dd" stroke-width="2"/>
    </g>
    <line x1="700" y1="322" x2="754" y2="322" stroke="#b9a9e1" stroke-width="3"/>
    <line x1="846" y1="322" x2="900" y2="322" stroke="#e4a5b7" stroke-width="3"/>
    <circle cx="800" cy="322" r="46" fill="#ffffff" stroke="#c7cdd7" stroke-width="2"/>
    <text class="spine-label mono" x="800" y="327" text-anchor="middle">TIME</text>
    <text class="row-main" x="108" y="316">event timestamp / WITHIN / grace</text>
    <text class="row-note" x="108" y="340">The window declares how long a match may wait.</text>
    <text class="row-main" x="928" y="316">$rowtime / watermark / interval join</text>
    <text class="row-note" x="928" y="340">Time progress bounds temporal work and cleanup.</text>

    <!-- STATE -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="374" width="620" height="72" rx="14" fill="#ffffff" stroke="#ded9ee" stroke-width="2"/>
      <rect x="900" y="374" width="620" height="72" rx="14" fill="#ffffff" stroke="#f0d5dd" stroke-width="2"/>
    </g>
    <line x1="700" y1="410" x2="754" y2="410" stroke="#b9a9e1" stroke-width="3"/>
    <line x1="846" y1="410" x2="900" y2="410" stroke="#e4a5b7" stroke-width="3"/>
    <circle cx="800" cy="410" r="46" fill="#ffffff" stroke="#c7cdd7" stroke-width="2"/>
    <text class="spine-label mono" x="800" y="415" text-anchor="middle">STATE</text>
    <text class="row-main" x="108" y="404">Kafka Streams state stores</text>
    <text class="row-note" x="108" y="428">The runtime retains unmatched rows and aggregates.</text>
    <text class="row-main" x="928" y="404">Flink managed state</text>
    <text class="row-note" x="928" y="428">The runtime retains the state required by the query.</text>

    <!-- RECOVERY -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="462" width="620" height="72" rx="14" fill="#ffffff" stroke="#ded9ee" stroke-width="2"/>
      <rect x="900" y="462" width="620" height="72" rx="14" fill="#ffffff" stroke="#f0d5dd" stroke-width="2"/>
    </g>
    <line x1="700" y1="498" x2="754" y2="498" stroke="#b9a9e1" stroke-width="3"/>
    <line x1="846" y1="498" x2="900" y2="498" stroke="#e4a5b7" stroke-width="3"/>
    <circle cx="800" cy="498" r="46" fill="#ffffff" stroke="#c7cdd7" stroke-width="2"/>
    <text class="spine-label mono" x="800" y="503" text-anchor="middle">RECOVERY</text>
    <text class="row-main" x="108" y="492">Kafka-backed changelog / replay</text>
    <text class="row-note" x="108" y="516">State and retained input support restoration.</text>
    <text class="row-main" x="928" y="492">checkpoint / savepoint</text>
    <text class="row-note" x="928" y="516">Runtime snapshots support recovery and controlled moves.</text>

    <!-- LIFECYCLE -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="550" width="620" height="72" rx="14" fill="#ffffff" stroke="#ded9ee" stroke-width="2"/>
      <rect x="900" y="550" width="620" height="72" rx="14" fill="#ffffff" stroke="#f0d5dd" stroke-width="2"/>
    </g>
    <line x1="700" y1="586" x2="754" y2="586" stroke="#b9a9e1" stroke-width="3"/>
    <line x1="846" y1="586" x2="900" y2="586" stroke="#e4a5b7" stroke-width="3"/>
    <circle cx="800" cy="586" r="46" fill="#ffffff" stroke="#c7cdd7" stroke-width="2"/>
    <text class="spine-label mono" x="800" y="591" text-anchor="middle">LIFECYCLE</text>
    <text class="row-main" x="108" y="580">Persistent query / application</text>
    <text class="row-note" x="108" y="604">Continuous work must be observed and stopped.</text>
    <text class="row-main" x="928" y="580">Streaming statement / job</text>
    <text class="row-note" x="928" y="604">Continuous work must be observed and stopped.</text>

    <!-- Takeaway -->
    <g filter="url(#soft-shadow)">
      <rect x="80" y="658" width="1440" height="70" rx="18" fill="#edf5f3" stroke="#b7d8d0" stroke-width="2"/>
    </g>
    <rect x="80" y="658" width="8" height="70" rx="4" fill="#198f78"/>
    <text class="takeaway" x="116" y="691">SQL hides code, not state, time, or operations.</text>
    <text class="takeaway-note" x="116" y="715">Choose the runtime only after every row has an owner, a boundary, a recovery path, and a stop action.</text>
  </g>
</svg>

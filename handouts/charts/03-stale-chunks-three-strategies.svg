<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 906" role="img" aria-label="A new policy version must not leave the old answer active" style="width:100%;height:auto;display:block">
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
  .m{font-family:'SF Mono', Menlo, Consolas, monospace}
  text{dominant-baseline:auto}
</style>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#16181d"/></marker>
<marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9aa0aa"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a33d3d"/></marker>
<marker id="a-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0e7f66"/></marker>
<marker id="a-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3565f2"/></marker>
<marker id="a-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6f4fc3"/></marker>
</defs>
<rect width="1320" height="906" fill="#ffffff"/>
<text class="t" x="32" y="46" font-size="30" font-weight="700" letter-spacing="-.02em" fill="#16181d">A new policy version must not leave the old answer active</text>
<text class="t" x="32" y="78" font-size="18" fill="#626873">P-123 renews. Version 7 replaces version 6. Three ways to update the index; two of them can be seen by a customer.</text>
<rect x="32" y="118" width="1256" height="200" rx="18" fill="none" stroke="#edc7c7"/>
<text class="m" x="52" y="148" font-size="14" font-weight="700" letter-spacing=".10em" fill="#a33d3d">UNSAFE · APPEND FOREVER</text>
<rect x="56" y="170" width="250" height="78" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="181" y="206" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">v7 event</text>
<text class="t" x="181" y="228" font-size="14" text-anchor="middle" fill="#626873">policy P-123</text>
<line x1="306" y1="209" x2="356" y2="209" stroke="#16181d" stroke-width="1.6" marker-end="url(#a-ink)"/>
<rect x="356" y="170" width="250" height="78" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="481" y="206" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Embed and insert</text>
<text class="t" x="481" y="228" font-size="14" text-anchor="middle" fill="#626873">no removal step</text>
<line x1="606" y1="209" x2="656" y2="209" stroke="#16181d" stroke-width="1.6" marker-end="url(#a-ink)"/>
<rect x="656" y="170" width="250" height="78" rx="14" fill="#f9eaea" stroke="#edc7c7"/>
<text class="t" x="781" y="206" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#a33d3d">Index holds v6 AND v7</text>
<text class="t" x="781" y="228" font-size="14" text-anchor="middle" fill="#626873">both are searchable</text>
<circle cx="69" cy="283" r="13" fill="#f9eaea" stroke="#edc7c7"/>
<text class="t" x="69" y="289" font-size="15" font-weight="700" text-anchor="middle" fill="#a33d3d">&#10007;</text>
<text class="t" x="90" y="289" font-size="16" font-weight="600" fill="#a33d3d">The assistant can quote a contract that no longer applies.</text>
<rect x="32" y="352" width="1256" height="200" rx="18" fill="none" stroke="#edc7c7"/>
<text class="m" x="52" y="382" font-size="14" font-weight="700" letter-spacing=".10em" fill="#a33d3d">ALSO UNSAFE · DELETE FIRST, THEN INSERT</text>
<rect x="56" y="404" width="250" height="78" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="181" y="440" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">v7 event</text>
<text class="t" x="181" y="462" font-size="14" text-anchor="middle" fill="#626873">policy P-123</text>
<line x1="306" y1="443" x2="356" y2="443" stroke="#16181d" stroke-width="1.6" marker-end="url(#a-ink)"/>
<rect x="356" y="404" width="250" height="78" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="481" y="440" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Delete all v6 chunks</text>
<text class="t" x="481" y="462" font-size="14" text-anchor="middle" fill="#626873">index now empty for P-123</text>
<line x1="606" y1="443" x2="656" y2="443" stroke="#16181d" stroke-width="1.6" marker-end="url(#a-ink)"/>
<rect x="656" y="404" width="250" height="78" rx="14" fill="#f9eaea" stroke="#edc7c7"/>
<text class="t" x="781" y="440" font-size="20" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#a33d3d">Embed v7 — fails</text>
<text class="t" x="781" y="462" font-size="14" text-anchor="middle" fill="#626873">API error, pod restart</text>
<circle cx="69" cy="517" r="13" fill="#f9eaea" stroke="#edc7c7"/>
<text class="t" x="69" y="523" font-size="15" font-weight="700" text-anchor="middle" fill="#a33d3d">&#10007;</text>
<text class="t" x="90" y="523" font-size="16" font-weight="600" fill="#a33d3d">The policy is unsearchable. The customer gets nothing at all.</text>
<rect x="32" y="586" width="1256" height="264" rx="18" fill="#e7f3f0" stroke="#c0e0d8"/>
<text class="m" x="52" y="616" font-size="14" font-weight="700" letter-spacing=".10em" fill="#0e7f66">SAFE · STAGE, VERIFY, COMMIT, THEN RETIRE</text>
<rect x="56" y="638" width="202" height="84" rx="14" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="157" y="667" font-size="18" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">1 Validate</text>
<text class="t" x="157" y="687" font-size="14" text-anchor="middle" fill="#626873">reject stale</text>
<text class="t" x="157" y="706" font-size="14" text-anchor="middle" fill="#626873">or duplicate</text>
<line x1="258" y1="680" x2="300" y2="680" stroke="#0e7f66" stroke-width="1.6" marker-end="url(#a-grn)"/>
<rect x="300" y="638" width="202" height="84" rx="14" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="401" y="667" font-size="18" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">2 Stage</text>
<text class="t" x="401" y="687" font-size="14" text-anchor="middle" fill="#626873">write under</text>
<text class="t" x="401" y="706" font-size="14" text-anchor="middle" fill="#626873">doc id + version</text>
<line x1="502" y1="680" x2="544" y2="680" stroke="#0e7f66" stroke-width="1.6" marker-end="url(#a-grn)"/>
<rect x="544" y="638" width="202" height="84" rx="14" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="645" y="667" font-size="18" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">3 Verify</text>
<text class="t" x="645" y="687" font-size="14" text-anchor="middle" fill="#626873">counts and</text>
<text class="t" x="645" y="706" font-size="14" text-anchor="middle" fill="#626873">embeddings ok</text>
<line x1="746" y1="680" x2="788" y2="680" stroke="#0e7f66" stroke-width="1.6" marker-end="url(#a-grn)"/>
<rect x="788" y="638" width="202" height="84" rx="14" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="889" y="667" font-size="18" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">4 Commit</text>
<text class="t" x="889" y="687" font-size="14" text-anchor="middle" fill="#626873">switch active set</text>
<text class="t" x="889" y="706" font-size="14" text-anchor="middle" fill="#626873">in the catalog</text>
<line x1="990" y1="680" x2="1032" y2="680" stroke="#0e7f66" stroke-width="1.6" marker-end="url(#a-grn)"/>
<rect x="1032" y="638" width="202" height="84" rx="14" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="1133" y="667" font-size="18" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">5 Retire</text>
<text class="t" x="1133" y="687" font-size="14" text-anchor="middle" fill="#626873">drop v6 after</text>
<text class="t" x="1133" y="706" font-size="14" text-anchor="middle" fill="#626873">a grace period</text>
<text class="t" x="56" y="746" font-size="13" fill="#0e7f66" text-anchor="start">WHAT THE CUSTOMER CAN SEARCH</text>
<rect x="56" y="754" width="833" height="34" rx="9" fill="#ffffff" stroke="#c0e0d8"/>
<text class="t" x="472" y="777" font-size="15" font-weight="600" text-anchor="middle" fill="#0e7f66">v6 — still answering, the whole time</text>
<rect x="889" y="754" width="375" height="34" rx="9" fill="#0e7f66" opacity=".12"/>
<rect x="889" y="754" width="375" height="34" rx="9" fill="none" stroke="#0e7f66"/>
<text class="t" x="1076" y="777" font-size="15" font-weight="700" text-anchor="middle" fill="#0e7f66">v7</text>
<line x1="889" y1="722" x2="889" y2="754" stroke="#0e7f66" stroke-width="1.6" stroke-dasharray="4 4"/>
<text class="t" x="899" y="746" font-size="13" fill="#0e7f66" text-anchor="start">the switch, and the only moment anything changes</text>
<circle cx="69" cy="817" r="13" fill="#e7f3f0" stroke="#c0e0d8"/>
<text class="t" x="69" y="823" font-size="15" font-weight="700" text-anchor="middle" fill="#0e7f66">&#10003;</text>
<text class="t" x="90" y="823" font-size="16" font-weight="600" fill="#0e7f66">No window with a wrong answer, and no window with no answer. That is the whole point of the ordering.</text>
<line x1="32" y1="858" x2="1288" y2="858" stroke="#e4e5e1"/>
<text class="t" x="32" y="884" font-size="17" font-weight="600" fill="#16181d">Kafka delivers the trigger. The consumer owns the switch. Never delete first.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 250" role="img" style="width:100%;height:auto;display:block">
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
  .m{font-family:'SF Mono', Menlo, Consolas, monospace}
</style>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#16181d"/></marker>
<marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9aa0aa"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a33d3d"/></marker>
</defs>
<rect width="1320" height="250" fill="#ffffff"/>
<text class="m" x="32" y="22" font-size="14" font-weight="700" letter-spacing=".10em" fill="#626873">SOURCE</text>
<rect x="32" y="34" width="232" height="108" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="148" y="80" font-size="19" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Event simulator</text>
<text class="t" x="148" y="104" font-size="13.5" text-anchor="middle" fill="#626873">synthetic user events</text>
<line x1="264" y1="88" x2="290" y2="88" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#a-mut)"/>
<text class="m" x="290" y="22" font-size="14" font-weight="700" letter-spacing=".10em" fill="#626873">KAFKA</text>
<rect x="290" y="34" width="232" height="108" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="406" y="80" font-size="19" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Self-managed cluster</text>
<text class="t" x="406" y="104" font-size="13.5" text-anchor="middle" fill="#626873">three event topics</text>
<line x1="522" y1="88" x2="548" y2="88" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#a-mut)"/>
<text class="m" x="548" y="22" font-size="14" font-weight="700" letter-spacing=".10em" fill="#626873">PROCESS</text>
<rect x="548" y="34" width="232" height="108" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="664" y="80" font-size="19" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Spark Streaming</text>
<text class="t" x="664" y="104" font-size="13.5" text-anchor="middle" fill="#626873">then hourly orchestration</text>
<line x1="780" y1="88" x2="806" y2="88" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#a-mut)"/>
<text class="m" x="806" y="22" font-size="14" font-weight="700" letter-spacing=".10em" fill="#626873">STORE</text>
<rect x="806" y="34" width="232" height="108" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="922" y="80" font-size="19" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">Lake → warehouse</text>
<text class="t" x="922" y="104" font-size="13.5" text-anchor="middle" fill="#626873">partitioned parquet</text>
<line x1="1038" y1="88" x2="1064" y2="88" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#a-mut)"/>
<text class="m" x="1064" y="22" font-size="14" font-weight="700" letter-spacing=".10em" fill="#626873">OUTPUT</text>
<rect x="1064" y="34" width="232" height="108" rx="14" fill="#ffffff" stroke="#e4e5e1"/>
<text class="t" x="1180" y="80" font-size="19" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#16181d">BI dashboard</text>
<text class="t" x="1180" y="104" font-size="13.5" text-anchor="middle" fill="#626873">songs, artists, activity</text>
<rect x="32" y="176" width="1256" height="54" rx="13" fill="#fff3d9" stroke="#eeda9f"/>
<text class="t" x="52" y="209" font-size="16.5" font-weight="600" fill="#8a5a06">Synthetic events are a legitimate source. The gap is provenance: adapted from an existing open-source pipeline without separating personal work.</text>
</svg>
